name: Portfolio app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build du projet
        run: npm run build

      - name: Déployer sur Netlify
        if: github.event_name == 'push' && success()
        env:
          NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
        run: |
          if [ -z "$NETLIFY_DEPLOY_HOOK" ]; then
            echo "Erreur : NETLIFY_DEPLOY_HOOK n'est pas défini"
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$NETLIFY_DEPLOY_HOOK"
